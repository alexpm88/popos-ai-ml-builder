name: Build Pop!_OS AI/ML Custom ISO

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      iso_version:
        description: 'Pop!_OS version'
        required: false
        default: '22.04'
        type: choice
        options:
        - '22.04'
        - '24.04'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap \
            squashfs-tools \
            xorriso \
            genisoimage \
            grub-pc-bin \
            wget \
            curl \
            bc

      - name: 📊 Check disk space
        run: |
          echo "Available disk space:"
          df -h
          echo "Required: ~20GB for build process"

      - name: 📥 Download base Pop!_OS ISO
        run: |
          echo "Downloading Pop!_OS ${{ github.event.inputs.iso_version || '22.04' }} NVIDIA ISO..."
          if [ "${{ github.event.inputs.iso_version || '22.04' }}" = "24.04" ]; then
            wget -O pop-os-base.iso "https://iso.pop-os.org/24.04/amd64/nvidia/pop-os_24.04_amd64_nvidia.iso"
          else
            wget -O pop-os-base.iso "https://iso.pop-os.org/22.04/amd64/nvidia/55/pop-os_22.04_amd64_nvidia_55.iso"
          fi
          echo "Verifying download..."
          ls -lh pop-os-base.iso

      - name: 📂 Create working directories
        run: |
          mkdir -p iso-extract mount-point
          echo "Working directories created"

      - name: 📦 Mount and extract ISO
        run: |
          echo "Mounting base ISO..."
          sudo mount -o loop pop-os-base.iso mount-point
          
          echo "Copying ISO contents..."
          sudo cp -rT mount-point/ iso-extract/
          
          echo "Unmounting ISO..."
          sudo umount mount-point

      - name: 🔧 Extract filesystem
        run: |
          cd iso-extract
          echo "Extracting filesystem.squashfs..."
          sudo unsquashfs casper/filesystem.squashfs
          sudo mv squashfs-root custom-root
          echo "Filesystem extracted successfully"

      - name: 🔧 Prepare chroot environment
        run: |
          cd iso-extract
          echo "Preparing chroot environment..."
          sudo cp /etc/resolv.conf custom-root/etc/resolv.conf
          
          # Copy scripts from root directory (not from scripts/ folder)
          sudo cp ../customize-system.sh custom-root/tmp/
          sudo cp ../install-ai-packages.sh custom-root/tmp/
          sudo cp ../verify-nvidia.sh custom-root/tmp/
          sudo cp ../setup-ai-env.sh custom-root/tmp/
          sudo cp ../start-jupyter.sh custom-root/tmp/
          sudo cp ../ai-first-setup.desktop custom-root/tmp/
          
          echo "Scripts copied to chroot environment"

      - name: 🤖 Customize system
        run: |
          cd iso-extract
          echo "Starting system customization..."
          sudo chroot custom-root /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive
            echo 'Running system customization...'
            bash /tmp/customize-system.sh
            
            echo 'Installing AI/ML packages...'
            bash /tmp/install-ai-packages.sh
            
            echo 'Setting up user templates...'
            cp /tmp/setup-ai-env.sh /etc/skel/
            cp /tmp/start-jupyter.sh /etc/skel/
            mkdir -p /etc/skel/.config/autostart
            cp /tmp/ai-first-setup.desktop /etc/skel/.config/autostart/
            chmod +x /etc/skel/setup-ai-env.sh
            chmod +x /etc/skel/start-jupyter.sh
            
            echo 'Cleaning up...'
            rm -rf /tmp/*
            apt-get autoremove -y
            apt-get autoclean
            rm -rf /var/lib/apt/lists/*
            rm -f /etc/resolv.conf
            
            echo 'System customization completed'
          "

      - name: 📦 Rebuild filesystem
        run: |
          cd iso-extract
          echo "Rebuilding filesystem..."
          sudo du -sx --block-size=1 custom-root | cut -f1 > casper/filesystem.size
          sudo rm -f casper/filesystem.squashfs
          sudo mksquashfs custom-root casper/filesystem.squashfs -comp xz -b 1M
          echo "Filesystem rebuilt successfully"

      - name: 🔥 Create final ISO
        run: |
          cd iso-extract
          echo "Creating final ISO..."
          sudo xorriso -as mkisofs \
            -r -V "Pop!_OS AI/ML Edition" \
            -o ../pop-os-ai-ml-custom-$(date +%Y%m%d).iso \
            -J -l -cache-inodes \
            -b isolinux/isolinux.bin -c isolinux/boot.cat \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            -eltorito-alt-boot -e boot/grub/efi.img -no-emul-boot \
            -isohybrid-gpt-basdat .
          
          cd ..
          echo "ISO creation completed"

      - name: 📋 Generate checksums
        run: |
          echo "Generating checksums..."
          sha256sum pop-os-ai-ml-custom-*.iso > checksums.txt
          echo "Checksums generated"

      - name: 📊 Show results
        run: |
          echo "Build completed successfully!"
          echo "Files created:"
          ls -lh pop-os-ai-ml-custom-*.iso checksums.txt
          echo ""
          echo "Checksums:"
          cat checksums.txt

      - name: 📤 Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: pop-os-ai-ml-custom-iso
          path: |
            pop-os-ai-ml-custom-*.iso
            checksums.txt
          retention-days: 30

      - name: 🧹 Cleanup
        if: always()
        run: |
          echo "Cleaning up build artifacts..."
          sudo rm -rf iso-extract mount-point
          echo "Cleanup completed"
